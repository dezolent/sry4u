[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SITE_URL = "https://sry4u.com"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Secrets belong in Netlify's environment variable settings, never this file.
# Set BANDSINTOWN_API_KEY for both Builds and Functions.
# PUBLIC_GA_MEASUREMENT_ID and PUBLIC_MERCH_URL are optional public values.

[[headers]]
  for = "/api/events"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/api/events"
  to = "/.netlify/functions/events"
  status = 200
  force = true

[[redirects]]
  from = "/api/events/"
  to = "/.netlify/functions/events"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
